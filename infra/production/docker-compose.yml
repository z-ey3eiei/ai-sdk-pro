name: ai-sdk-pro
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to your built checkpoint image}
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - /opt/ai-sdk-pro/config/app.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TRUST_PROXY: "true"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-https://ai-sdk.pro}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      NEON_DATABASE_URL: "${NEON_DATABASE_URL:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-ai-sdk-pro}"
    expose:
      - "3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/apps/web/.next/cache:rw,nosuid,nodev,size=128m,uid=1001,gid=1001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/ai-sdk-pro/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
