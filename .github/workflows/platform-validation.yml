name: Platform validation (no deployment)

on:
  push:
    branches:
      - feat/platform-phases-0-6-20261117
      - feat/keyless-staging-safety-20261117

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Strict typecheck, security tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript strict checks
        run: pnpm typecheck
      - name: Vitest regressions and security boundaries
        run: pnpm test
      - name: Install isolated Cloudflare platform test dependencies
        run: npm install --prefix infra/cloudflare-platform --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Cloudflare platform Node test suite
        run: pnpm -C infra/cloudflare-platform test
      - name: Monorepo build
        run: pnpm build
      - name: Cloudflare Keyless Worker dry-run bundle (no deployment)
        run: pnpm -C apps/agent-worker exec wrangler deploy --dry-run --config wrangler.jsonc --outdir /tmp/aisdkpro-agent-preview
