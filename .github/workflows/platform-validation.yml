name: Platform validation (no deployment)

on:
  push:
    branches:
      - feat/platform-phases-0-6-20261117
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Strict typecheck, security tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript strict checks
        run: pnpm typecheck
      - name: Vitest regressions and security boundaries
        run: pnpm test
      - name: Monorepo build
        run: pnpm build
