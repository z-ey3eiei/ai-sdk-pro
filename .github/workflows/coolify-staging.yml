name: Build and deploy to Coolify staging

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: After publishing, trigger the configured Coolify staging deployment
        type: boolean
        default: false
      publish_preview_dispatcher:
        description: Build and publish the isolated staging Preview queue worker
        type: boolean
        default: false

permissions: {}
concurrency:
  group: coolify-staging
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloudflare/workers-for-platforms'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/z-ey3eiei/ai-sdk-pro-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and smoke-test the image
        shell: bash
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --tag "$IMAGE:sha-$GITHUB_SHA" .
          container="$(docker run -d -p 127.0.0.1::3000 "$IMAGE:sha-$GITHUB_SHA")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          port="$(docker port "$container" 3000/tcp | awk -F: 'NR==1 {print $NF}')"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --max-time 5 "http://127.0.0.1:$port/api/health" >/dev/null
      - name: Publish to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:coolify-staging"
            docker push "$IMAGE:coolify-staging"
          fi

      - name: Build and publish the preview dispatcher
        if: inputs.publish_preview_dispatcher
        shell: bash
        run: |
          set -euo pipefail
          tag="$IMAGE:preview-dispatcher-$GITHUB_SHA"
          docker build --target preview-dispatcher --tag "$tag" .
          docker run --rm --entrypoint bash "$tag" -n infra/project-preview/run-dispatcher.sh
          docker run --rm --entrypoint node "$tag" --experimental-strip-types --check apps/web/scripts/dispatch-preview.ts
          docker push "$tag"

  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: coolify-staging
    steps:
      - name: Queue the Coolify staging deployment
        shell: bash
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          : "${COOLIFY_TOKEN:?Set COOLIFY_TOKEN in the coolify-staging GitHub environment}"
          : "${COOLIFY_WEBHOOK:?Set COOLIFY_WEBHOOK in the coolify-staging GitHub environment}"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, parse_qs
          url = urlsplit(os.environ['COOLIFY_WEBHOOK'])
          if (url.scheme != 'https' or url.netloc != 'coolify.orevrk.cloud'
              or url.path != '/api/v1/deploy' or not parse_qs(url.query).get('uuid')
              or url.fragment):
              raise SystemExit('Expected the authenticated deploy URL from the Coolify staging application')
          PY
          curl --fail --silent --show-error --max-time 20 --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --output /dev/null "$COOLIFY_WEBHOOK"
          printf '%s\n' 'Coolify accepted the deployment request. Check Deployment Logs for completion.'
